version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartwatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartwatt
      POSTGRES_USER: smartwatt
      POSTGRES_PASSWORD: smartwatt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infra/sql:/docker-entrypoint-initdb.d:ro

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartwatt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
